<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="Ember-16.png"/>
  <title>Embers Adrift Tracker User Editor</title>
  <!-- Import Vuetify CSS -->
  <link href="https://cdn.jsdelivr.net/npm/vuetify@3.12.1/dist/vuetify.min.css" rel="stylesheet">
  <!-- Import MDI font CSS -->
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css" rel="stylesheet">
  <!-- Import Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Import Vuetify 3 JS (ensure version compatibility with CSS) -->
  <script src="https://cdn.jsdelivr.net/npm/vuetify@3.12.1/dist/vuetify.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "@noble/hashes/crypto": "./vendor/noble-hashes-crypto-shim.js"
    }
  }
  </script>
  <style>
    .alt-rows .v-row:nth-child(odd) {
      background-color: #f2f2f2; /* Light gray for odd rows */
    }
    .alt-rows .v-row:nth-child(even) {
      background-color: #ffffff; /* White for even rows */
    }
    .char-rows {
      width: 100%;
      overflow-x: auto;
    }
    .char-row-flex {
      display: flex;
      flex-flow: row wrap;
      align-items: flex-start;
      gap: 10px 12px;
      padding: 12px 4px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    .char-row-flex:last-child {
      border-bottom: none;
    }
    /* Fixed name width — does not consume extra horizontal space */
    .char-name-cell {
      flex: 0 0 220px;
      width: 220px;
      max-width: 100%;
    }
    /* Sized for longest class label (“Juggernaut”) + prepend icon */
    .char-class-cell {
      flex: 0 0 auto;
    }
    .char-class-select {
      max-width: 100%;
    }
    /* ~“Level” + two digits, stacked number control */
    .char-level-cell {
      flex: 0 0 auto;
    }
    .char-level-input {
      width: 9rem;
      max-width: 100%;
    }
    /* Fixed width each — no flex-grow, so they stay ~half of “full row” phonetic span */
    .char-phonetic-cell {
      flex: 0 0 12.5rem;
      width: 12.5rem;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div id="app">
    <v-app>
      <v-main>
        <v-container class="ma-5 pa-5 bg-primary" fluid>
          <v-btn v-if="this.authed == false" @click="auth">Log In</v-btn>
          <v-btn v-if="this.authed == true" disabled><i>Logged In</i></v-btn>
          <v-form :disabled="this.authed == false"><v-card>
            <v-card-title>
            <v-icon icon="mdi-trash-can-outline" @click="delChars()"></v-icon> Character List
            </v-card-title>
            <v-row class="mb-4" align="center" dense>
              <v-col cols="12" md="6">
                <v-select
                  v-model="selectedVoiceURI"
                  :items="voices"
                  item-title="label"
                  item-value="uri"
                  label="Browser voice (JS TTS)"
                  hide-details
                  dense
                  outlined
                ></v-select>
              </v-col>
              <v-col cols="12" md="6">
                <v-slider
                  v-model="voiceVolume"
                  min="0"
                  max="1"
                  step="0.01"
                  label="Volume"
                  thumb-label
                  dense
                >
                  <template #append>
                    <v-icon class="ml-2">mdi-volume-high</v-icon>
                  </template>
                </v-slider>
              </v-col>
            </v-row>
            <v-row class="mb-2" align="center" dense>
              <v-col cols="12">
                <v-select
                  v-model="selectedEdgeVoiceShortName"
                  :items="edgeVoiceSelectItems"
                  item-title="title"
                  item-value="value"
                  label="Discord voice (Edge TTS)"
                  :disabled="edgeVoiceSelectItems.length === 0"
                  hide-details
                  density="compact"
                  variant="outlined"
                ></v-select>
                <div v-if="edgeVoiceLoadError" class="text-caption text-error mt-1">
                  {{ edgeVoiceLoadError }}
                </div>
                <div v-else-if="edgeVoiceSelectItems.length === 0 && edgeVoicesTriedLoad" class="text-caption text-medium-emphasis mt-1">
                  No Edge voices loaded. Check network access to Microsoft speech endpoints, or try again later.
                </div>
              </v-col>
            </v-row>
            <v-row class="mb-2" dense>
              <v-col cols="12">
                <v-alert
                  v-if="edgeTtsBrowserHint"
                  type="info"
                  density="compact"
                  variant="tonal"
                  class="text-body-2"
                >
                  {{ edgeTtsBrowserHint }}
                </v-alert>
              </v-col>
            </v-row>
            <v-row class="mb-4" dense>
              <v-col cols="12">
                <v-text-field
                  v-model="edgeTtsProxyUrl"
                  label="Edge TTS proxy base URL (optional)"
                  hint="If play fails: from the embers folder run node edge-tts-proxy.mjs, then set http://10.47.73.81:8765 here (or HOST=… on the server). Pages served over HTTPS need an HTTPS proxy (or test on http://localhost)."
                  persistent-hint
                  density="compact"
                  variant="outlined"
                  hide-details="auto"
                ></v-text-field>
              </v-col>
            </v-row>
            <v-text-field id="new_char_name" clearable
                type="input" variant="solo" density="compact"
                label="Player Name" hint="Press Enter to add this new Player to the Character List"
                prepend-icon="mdi-account-box" append-icon="mdi-account-plus-outline"
                clearable persistent-clear persistent-counter
                @click:append="addChar()" @keyup.enter="addChar()"
            ></v-text-field>
            <hr>
            <div class="char-rows">
              <div
                v-for="id in sortedPlayerIds"
                :key="id"
                class="char-row-flex"
              >
                <div class="char-name-cell">
                  <v-text-field
                    v-model="charData[id].name"
                    readonly
                    variant="outlined"
                    density="comfortable"
                    rounded="6"
                    hide-details
                    prepend-icon="mdi-delete-circle"
                    icon-color="red"
                    label="Name"
                    @click:prepend="delChar(id)"
                  ></v-text-field>
                </div>
                <div class="char-class-cell">
                  <v-select
                    class="char-class-select"
                    :style="classSelectWidthStyle"
                    variant="outlined"
                    density="comfortable"
                    v-model="charData[id].charClass"
                    rounded="6"
                    hide-details
                    label="Class"
                    :items="charClasses"
                    item-value="id"
                    item-title="text"
                    :prepend-icon="charIcons[this.charData[id].charClass].icon"
                    :icon-color="charIcons[this.charData[id].charClass].color"
                  ></v-select>
                </div>
                <div class="char-level-cell">
                  <v-number-input
                    class="char-level-input"
                    v-model="charData[id].level"
                    control-variant="stacked"
                    variant="outlined"
                    inset
                    :max="50"
                    :min="1"
                    density="comfortable"
                    prefix="Level"
                    hide-details
                  ></v-number-input>
                </div>
                <div class="char-phonetic-cell">
                  <v-text-field
                    v-model="charData[id].js_phonetic"
                    rounded="6"
                    hide-details
                    variant="outlined"
                    density="comfortable"
                    label="JS phonetic"
                    append-icon="mdi-volume-high"
                    @click:append="speakPhoneticName(id)"
                  ></v-text-field>
                </div>
                <div class="char-phonetic-cell">
                  <v-text-field
                    v-model="charData[id].edge_phonetic"
                    rounded="6"
                    hide-details
                    variant="outlined"
                    density="comfortable"
                    label="Discord Phonetic"
                    append-icon="mdi-play-circle-outline"
                    :loading="edgeDiscordPlayBusy === id"
                    @click:append="speakDiscordPhonetic(id)"
                  ></v-text-field>
                </div>
              </div>
            </div>
          </v-card></v-form>

<!-- Debug stuff below -->
          <span v-if="devMode">
            <br>
            <textarea rows="30" cols="50" style="font-size: 10px;">{{ JSON.stringify(charData, null, 2) }}</textarea>
          </span>
        </v-container>
      </v-main>
    </v-app>
  </div>

  <script type="module" src="common.js"></script>
  <script type="module">

// Firebase config to enable remote viewing of the tracker data
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getDatabase, ref, set, child, get, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { lootRate, elapsedTracker, sortedTracker, suggest, localLoad, enumerateVoices, configSpeech } from './common.js';
/** Vendored edge-tts-browser with updated Chromium headers, MIME type, and WebSocket error handling. */
import EdgeTTSBrowser from './vendor/edge-tts-browser/index.js';

const firebaseConfig = {
    apiKey: "AIzaSyBJYHL7v9lBO5FDFGRTohp1yF94NVnYLOY",
    authDomain: "embertracker.firebaseapp.com",
    databaseURL: "https://embertracker-default-rtdb.firebaseio.com",
    projectId: "embertracker",
    storageBucket: "embertracker.firebasestorage.app",
    messagingSenderId: "930812014694",
    appId: "1:930812014694:web:fecf713742575e36cafda7"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
var unsubscribe = null;

// Vue config and app initialization
const { createApp } = Vue;
// Vuetify initialization
const { createVuetify } = Vuetify;
//const { aliases, mdi } = Vuetify;
const vuetify = createVuetify({ icons: { defaultSet: 'mdi' } });

const App = {
    data() {
        return {
            authed: false,
            charData: {},
            devMode: 0,
            speech: null,
            voice: null,
            voices: [],
            selectedVoiceURI: null,
            voiceVolume: 0.7,
            edgeVoicesRaw: [],
            edgeVoicesTriedLoad: false,
            edgeVoiceLoadError: '',
            selectedEdgeVoiceShortName: null,
            edgeDiscordPlayBusy: null,
            /** POST ${base}/synth when set — see edge-tts-proxy.mjs (browser WebSocket to Microsoft often fails). */
            edgeTtsProxyUrl: '',
            charClasses: [
                { id: 'berserker',  text: 'Berserker'  },
                { id: 'brigand',    text: 'Brigand'    },
                { id: 'duelist',    text: 'Duelist'    },
                { id: 'knight',     text: 'Knight'     },
                { id: 'juggernaut', text: 'Juggernaut' },
                { id: 'marshal',    text: 'Marshal'    },
                { id: 'sentinel',   text: 'Sentinel'   },
                { id: 'warden',     text: 'Warden'     },
                { id: 'warlord',    text: 'Warlord'    },
            ],
            charIcons: {
                'berserker':  {'icon': 'mdi-axe-battle', 'color': 'red'},
                'brigand':    {'icon': 'mdi-sword-cross', 'color': 'red'},
                'duelist':    {'icon': 'mdi-sword', 'color': 'green'},
                'knight':     {'icon': 'mdi-shield-sword', 'color': 'blue'},
                'juggernaut': {'icon': 'mdi-gavel', 'color': 'blue'},
                'marshal':    {'icon': 'mdi-security', 'color': 'blue'},
                'sentinel':   {'icon': 'mdi-chess-rook', 'color': 'green'},
                'warden':     {'icon': 'mdi-ladybug', 'color': 'red'},
                'warlord':    {'icon': 'mdi-music', 'color': 'green'},
                "Unknown":    {'icon': 'mdi-help-box', 'color': 'black'}
            },
        }
    },
    methods: {
        // Converts a string to Title Case for display purposes
        toTitleCase(str) {
            if (!str) return "";
            return str.toLowerCase().replace(/(^|\s)\w/g, (match) => match.toUpperCase());
        },
        // Converts a string to a lowercase, no-space version for consistent ID usage
        toIdCase(str) {
            if (!str) return "";
            return str.toLowerCase().replace(/\s+/g, '');
        },
        localLoad,
        enumerateVoices,
        configSpeech,
        speakPhoneticName(playerId) {
            if (!('speechSynthesis' in window)) return;
            if (!this.speech) this.speech = window.speechSynthesis;
            if (!this.voice) this.configSpeech();
            if (!this.voice) return;

            const player = this.charData[playerId];
            if (!player) return;
            const phrase = (player.js_phonetic || player.name || '').trim();
            if (!phrase) return;

            const utterance = new SpeechSynthesisUtterance(phrase);
            utterance.voice = this.voice;
            utterance.volume = Number(this.voiceVolume) || 0.7;
            this.speech.speak(utterance);
        },
        escapeForEdgeTtsXml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        },
        formatEdgeTtsError(e) {
            if (e instanceof Error) {
                let s = e.message || String(e);
                if (e.cause instanceof Error && e.cause.message) {
                    s += ' — ' + e.cause.message;
                }
                return s;
            }
            if (typeof e === 'string') {
                if (e === '[object Event]' || e.startsWith('[object ')) {
                    return 'Browser reported a generic connection error. The vendored Edge TTS client was updated (Chromium 143 headers, MP3 MIME, protocol fixes). If this persists, a network or policy block on WebSockets to speech.platform.bing.com is likely.';
                }
                return e;
            }
            return String(e);
        },
        stopDiscordTtsPlayback() {
            if (this._discordTtsAudio) {
                try {
                    this._discordTtsAudio.pause();
                    this._discordTtsAudio.src = '';
                } catch (_) { /* ignore */ }
                this._discordTtsAudio = null;
            }
            if (this._discordTtsObjectUrl) {
                try {
                    URL.revokeObjectURL(this._discordTtsObjectUrl);
                } catch (_) { /* ignore */ }
                this._discordTtsObjectUrl = null;
            }
        },
        async enumerateEdgeVoices() {
            this.edgeVoicesTriedLoad = true;
            this.edgeVoiceLoadError = '';
            try {
                const raw = await EdgeTTSBrowser.getVoices();
                if (!Array.isArray(raw)) {
                    this.edgeVoicesRaw = [];
                    this.edgeVoiceLoadError = 'Edge TTS voice list was not returned (see console).';
                    return;
                }
                this.edgeVoicesRaw = raw
                    .filter((v) => v && v.ShortName && v.FriendlyName)
                    .sort((a, b) => String(a.FriendlyName).localeCompare(String(b.FriendlyName)));

                const saved = localStorage.getItem('selectedEdgeVoiceShortName');
                if (saved && this.edgeVoicesRaw.some((v) => v.ShortName === saved)) {
                    this.selectedEdgeVoiceShortName = saved;
                } else {
                    const preferred = this.edgeVoicesRaw.find((v) => String(v.ShortName).includes('GuyNeural'))
                        || this.edgeVoicesRaw.find((v) => String(v.Locale || '').toLowerCase().startsWith('en'))
                        || this.edgeVoicesRaw[0];
                    this.selectedEdgeVoiceShortName = preferred ? preferred.ShortName : null;
                }
            } catch (e) {
                console.error('Edge TTS voice list failed', e);
                this.edgeVoicesRaw = [];
                this.edgeVoiceLoadError = 'Could not load Edge TTS voices (network, CORS, or blocking).';
            }
        },
        async playDiscordMp3Blob(blob) {
            const url = URL.createObjectURL(blob);
            this._discordTtsObjectUrl = url;
            const audio = new Audio(url);
            audio.volume = Number(this.voiceVolume) || 0.7;
            this._discordTtsAudio = audio;
            const cleanup = () => {
                try {
                    URL.revokeObjectURL(url);
                } catch (_) { /* ignore */ }
                if (this._discordTtsObjectUrl === url) this._discordTtsObjectUrl = null;
                this._discordTtsAudio = null;
            };
            audio.addEventListener('ended', cleanup);
            audio.addEventListener('error', cleanup);
            await audio.play();
        },
        async speakDiscordPhoneticThroughProxy(playerId, phrase, base) {
            this.edgeDiscordPlayBusy = playerId;
            this.stopDiscordTtsPlayback();
            try {
                const safe = this.escapeForEdgeTtsXml(phrase);
                const r = await fetch(`${base}/synth`, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: safe,
                        voice: this.selectedEdgeVoiceShortName,
                    }),
                });
                const errBody = !r.ok ? await r.text().catch(() => '') : '';
                if (!r.ok) {
                    throw new Error(errBody || `Proxy returned HTTP ${r.status}`);
                }
                const ab = await r.arrayBuffer();
                const blob = new Blob([ab], { type: 'audio/mpeg' });
                await this.playDiscordMp3Blob(blob);
            } catch (e) {
                console.error('Edge TTS proxy playback failed', e);
                alert('Discord (Edge) TTS proxy failed: ' + this.formatEdgeTtsError(e));
                this.stopDiscordTtsPlayback();
            } finally {
                this.edgeDiscordPlayBusy = null;
            }
        },
        async speakDiscordPhonetic(playerId) {
            const player = this.charData[playerId];
            if (!player) return;
            const phrase = (player.edge_phonetic || player.name || '').trim();
            if (!phrase) return;

            if (!this.selectedEdgeVoiceShortName) {
                alert('Choose a Discord (Edge TTS) voice in the list above first.');
                return;
            }
            if (this.edgeDiscordPlayBusy) return;

            const proxyBase = (this.edgeTtsProxyUrl || '').trim().replace(/\/$/, '');
            if (proxyBase) {
                await this.speakDiscordPhoneticThroughProxy(playerId, phrase, proxyBase);
                return;
            }

            this.edgeDiscordPlayBusy = playerId;
            this.stopDiscordTtsPlayback();

            try {
                const safe = this.escapeForEdgeTtsXml(phrase);
                const browser = new EdgeTTSBrowser({
                    voice: this.selectedEdgeVoiceShortName,
                    text: safe,
                });
                const blob = await browser.ttsToFile();
                await this.playDiscordMp3Blob(blob);
            } catch (e) {
                console.error('Edge TTS playback failed', e);
                let msg = this.formatEdgeTtsError(e);
                if (/WebSocket|Microsoft Edge TTS WebSocket/i.test(msg)) {
                    msg +=
                        ' In most browsers you need the proxy: run `node edge-tts-proxy.mjs` on the server, then set Edge TTS proxy base URL to http://10.47.73.81:8765 (override HOST if needed, or try Microsoft Edge).';
                }
                alert('Discord (Edge) TTS failed: ' + msg);
                this.stopDiscordTtsPlayback();
            } finally {
                this.edgeDiscordPlayBusy = null;
            }
        },
        addChar(name, charClass='Unknown', level=50) {
            if (!this.authed) {
                alert('You are not logged in.');
                return;
            }
            // Add a new character to the charData based on the input field value
            const input = document.getElementById('new_char_name');
            if (!name) {
                name = input.value.trim();
                input.value = '';
                input.focus();
            }
            let id = this.toIdCase(name);
            if (name && !(id in this.charData)) {
                // Add the new character with default values
                this.charData[id] = {
                    charClass: charClass,
                    level: level,
                    name: this.toTitleCase(name),
                    js_phonetic: '',
                    edge_phonetic: '',
                };
                input.value = '';
            }
        },
        delChar(id) {
            if (confirm(`Are you sure you want to delete character: ${this.charData[id].name}?\nThis action cannot be undone.`)) {
                if (id in this.charData) {
                    delete this.charData[id];
                } else {
                    console.warn(`Attempted to delete non-existent character with id: ${id}`);
                }
            }
        },
        delChars() {
            if (confirm(`Are you sure you want to delete ALL characters?\nThis action cannot be undone.`)) {
                if (confirm('Just to be clear, ARE YOU SURE?\nYou want to enter all those names again manually?')) {
                    this.charData = {};
                }
            }
        },
        dev() {
            // Add a few test characters from Scooby-Doo and trackers for demonstration purposes
            this.addChar("Shaggy");
            this.addChar("Velma");
            this.addChar("Fred");
            this.addChar("Daphne");
            this.addChar("Scooby");
            this.addChar("Old Man Withers");
        },
        devSkralg() {
            // Add a few test characters from Scooby-Doo and trackers for demonstration purposes
            this.addChar("Skralg", "warden");
        },
        migrateCharDataShape(data) {
            if (!data || typeof data !== 'object') return data;
            for (const id of Object.keys(data)) {
                const entry = data[id];
                if (!entry || typeof entry !== 'object') continue;
                if (Object.prototype.hasOwnProperty.call(entry, 'phonetic')) {
                    const legacy = entry.phonetic;
                    if (entry.js_phonetic == null || entry.js_phonetic === '') {
                        entry.js_phonetic = legacy == null ? '' : String(legacy);
                    }
                    delete entry.phonetic;
                }
                if (entry.js_phonetic === undefined) entry.js_phonetic = '';
                if (entry.edge_phonetic === undefined) entry.edge_phonetic = '';
            }
            return data;
        },
        loadChars() {
            const tPath = 'charData';
            get(child(ref(db), tPath)).then((snapshot) => {
                if (snapshot.exists()) {
                    let newData = snapshot.val();
                    this.migrateCharDataShape(newData);
                    this.charData = newData;
                } else {
                    alert("No character data found.");
                    this.charData = {}; // don't leave it null or GUI cries
                }
            }).catch((error) => {
                console.error("Error loading character data: ", error);
            });
            // Subscribe to this newly loaded Tracker
            const dataRef = ref(db, tPath);
        },
        saveChars() {
            if (!this.authed) return;
            set(ref(db, 'charData'), this.charData);
        },
        auth() {
            if (!this.authed) {
                let pass = prompt("Please enter a valid password to authenticate.");
                if (!pass) return;
                const auth = getAuth();
                signInWithEmailAndPassword(auth, 'anon@ymo.us', pass).then((userCredential) => {
                    console.log('Anonymous login approved');
                    this.authed = true;
                    // Load characters from the database
                    this.loadChars();
                }).catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.error("Sign-in error: ", errorMessage);
                });
            }
        }
    },
    computed: {
        sortedPlayerIds() {
            return Object.keys(this.charData).sort((a, b) => {
                const A = this.charData[a];
                const B = this.charData[b];
                // Sort by checked status first, then alphabetically by name
                if (A.checked && !B.checked) return -1;
                if (!A.checked && B.checked) return 1;
                return A.name.localeCompare(B.name);
            })
        },
        /** Wide enough for longest class label + prepend icon + outlined field chrome. */
        classSelectWidthStyle() {
            const longest = this.charClasses.reduce((best, c) => {
                const t = String(c.text ?? '');
                return t.length > best.length ? t : best;
            }, '');
            const n = Math.max(longest.length, 1);
            const rem = Math.min(22, Math.max(11.25, n * 0.72 + 5.35));
            return { width: `${rem}rem`, maxWidth: '100%' };
        },
        edgeVoiceSelectItems() {
            return this.edgeVoicesRaw.map((v) => ({
                title: `${v.FriendlyName} (${v.Locale})`,
                value: v.ShortName,
            }));
        },
        edgeTtsBrowserHint() {
            if ((this.edgeTtsProxyUrl || '').trim()) return '';
            const ua = navigator.userAgent || '';
            if (/\bEdg\//.test(ua)) return '';
            return 'Discord preview uses a WebSocket to Microsoft; it often fails in Chrome and Firefox even when the voice list loads. Use the optional proxy field below, run node edge-tts-proxy.mjs, or open this page in Microsoft Edge.';
        },
    },
    watch: {
        charData: {
            handler(newData, oldData) { if (this.authed) this.saveChars(); },
            deep: true
        },
        selectedVoiceURI(newValue) {
            if (newValue) {
                localStorage.setItem('selectedVoiceURI', newValue);
                if (this.speech) {
                    const found = this.speech.getVoices().find(v => v.voiceURI === newValue);
                    if (found) this.voice = found;
                }
            }
        },
        voiceVolume(newValue) {
            if (newValue !== null && newValue !== undefined) {
                localStorage.setItem('voiceVolume', newValue);
            }
        },
        selectedEdgeVoiceShortName(newValue) {
            if (newValue) {
                localStorage.setItem('selectedEdgeVoiceShortName', newValue);
            }
        },
        edgeTtsProxyUrl(newValue) {
            if (newValue === undefined) return;
            try {
                const t = newValue == null ? '' : String(newValue).trim();
                if (t) localStorage.setItem('edgeTtsSynthProxyUrl', t);
                else localStorage.removeItem('edgeTtsSynthProxyUrl');
            } catch (_) { /* ignore */ }
        },
    },
    mounted() {
        // Detect dev mode based on URL parameter and set flag accordingly
        const urlParams = new URLSearchParams(window.location.search);
        this.devMode = urlParams.get('dev') === '1';

        // Add event listener to the whole app to toggle dev mode with ctrl-alt-d
        window.addEventListener('keydown', (event) => {
            if (event.ctrlKey && event.altKey && event.key === 'd') {
                this.devMode = !this.devMode;
            }
        });

        // Add event listener to the input field to allow adding characters by pressing Enter
        const charInput = document.getElementById('new_char_name');
        if (charInput) {
            charInput.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') this.addChar();
            });
        }
        // Focus the input field on page load for convenience
        charInput.focus();

        // Setup voice settings from saved preferences (shared with index.html)
        this.speech = window.speechSynthesis;
        if (this.speech) {
            this.speech.onvoiceschanged = () => { this.enumerateVoices(); };
            this.enumerateVoices();
        }
        this.localLoad();

        try {
            const p = localStorage.getItem('edgeTtsSynthProxyUrl');
            if (p) this.edgeTtsProxyUrl = p;
        } catch (_) { /* ignore */ }

        this.loadChars();
        this.enumerateEdgeVoices();
    },
    beforeUnmount() {
        this.stopDiscordTtsPlayback();
    },
};
createApp(App).use(vuetify).mount('#app')
  </script>
</body>
</html>
