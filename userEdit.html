<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="Ember-16.png"/>
  <title>Embers Adrift Tracker User Editor</title>
  <!-- Import Vuetify CSS -->
  <link href="https://cdn.jsdelivr.net/npm/vuetify@3.12.1/dist/vuetify.min.css" rel="stylesheet">
  <!-- Import MDI font CSS -->
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css" rel="stylesheet">
  <!-- Import Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Import Vuetify 3 JS (ensure version compatibility with CSS) -->
  <script src="https://cdn.jsdelivr.net/npm/vuetify@3.12.1/dist/vuetify.min.js"></script>
  <style>
    .alt-rows .v-row:nth-child(odd) {
      background-color: #f2f2f2; /* Light gray for odd rows */
    }
    .alt-rows .v-row:nth-child(even) {
      background-color: #ffffff; /* White for even rows */
    }
    .char-rows {
      width: 100%;
      overflow-x: auto;
    }
    .char-row-flex {
      display: flex;
      flex-flow: row wrap;
      align-items: flex-start;
      gap: 10px 12px;
      padding: 12px 4px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    .char-row-flex:last-child {
      border-bottom: none;
    }
    /* Fixed name width — does not consume extra horizontal space */
    .char-name-cell {
      flex: 0 0 220px;
      width: 220px;
      max-width: 100%;
    }
    /* Sized for longest class label ("Juggernaut") + prepend icon */
    .char-class-cell {
      flex: 0 0 auto;
    }
    .char-class-select {
      max-width: 100%;
    }
    /* ~"Level" + two digits, stacked number control */
    .char-level-cell {
      flex: 0 0 auto;
    }
    .char-level-input {
      width: 9rem;
      max-width: 100%;
    }
    /* Fixed width each — no flex-grow, so they stay ~half of "full row" phonetic span */
    .char-phonetic-cell {
      flex: 0 0 12.5rem;
      width: 12.5rem;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div id="app">
    <v-app>
      <v-main>
        <v-container class="ma-5 pa-5 bg-primary">
          <v-btn v-if="this.authed == false" @click="auth">Log In</v-btn>
          <v-btn v-if="this.authed == true" disabled><i>Logged In</i></v-btn>
          <v-form :xdisabled="this.authed == false"><v-card>
            <v-card-title>
            <v-icon icon="mdi-trash-can-outline" @click="delChars()"></v-icon> Character List
            </v-card-title>
            <v-row class="mb-4" align="center" dense>
              <v-col cols="12" md="6">
                <v-select
                  v-model="selectedVoice"
                  :items="Object.values(voiceGroups).flat()"
                  item-title="name"
                  item-value="id"
                  label="Kokoro Voice"
                  hide-details
                  dense
                  outlined
                ></v-select>
              </v-col>
              <v-col cols="12" md="6">
                <v-slider
                  v-model="volume"
                  min="0"
                  max="1"
                  step="0.05"
                  label="Volume"
                  thumb-label
                  dense
                >
                  <template #append>
                    <v-icon class="ml-2">mdi-volume-high</v-icon>
                  </template>
                </v-slider>
              </v-col>
            </v-row>
            <v-text-field id="new_char_name" clearable
                type="input" variant="solo" density="compact"
                label="Player Name" hint="Press Enter to add this new Player to the Character List"
                prepend-icon="mdi-account-box" append-icon="mdi-account-plus-outline"
                clearable persistent-clear persistent-counter
                @click:append="addChar()" @keyup.enter="addChar()"
            ></v-text-field>
            <hr>
            <div class="char-rows">
              <div
                v-for="id in sortedPlayerIds"
                :key="id"
                class="char-row-flex"
              >
                <div class="char-name-cell">
                  <v-text-field
                    v-model="charData[id].name"
                    readonly
                    variant="outlined"
                    density="comfortable"
                    rounded="6"
                    hide-details
                    prepend-icon="mdi-delete-circle"
                    icon-color="red"
                    label="Name"
                    @click:prepend="delChar(id)"
                  ></v-text-field>
                </div>
                <div class="char-class-cell">
                  <v-select
                    class="char-class-select"
                    :style="classSelectWidthStyle"
                    variant="outlined"
                    density="comfortable"
                    v-model="charData[id].charClass"
                    rounded="6"
                    hide-details
                    label="Class"
                    :items="charClasses"
                    item-value="id"
                    item-title="text"
                    :prepend-icon="charIcons[this.charData[id].charClass].icon"
                    :icon-color="charIcons[this.charData[id].charClass].color"
                  ></v-select>
                </div>
                <div class="char-level-cell">
                  <v-number-input
                    class="char-level-input"
                    v-model="charData[id].level"
                    control-variant="stacked"
                    variant="outlined"
                    inset
                    :max="50"
                    :min="1"
                    density="comfortable"
                    prefix="Level"
                    hide-details
                  ></v-number-input>
                </div>
                <div class="char-phonetic-cell">
                  <v-text-field
                    v-model="charData[id].phonetic"
                    rounded="6"
                    hide-details
                    variant="outlined"
                    density="comfortable"
                    label="Phonetic"
                    append-icon="mdi-volume-high"
                    @click:append="speakPhoneticName(id)"
                  ></v-text-field>
                </div>
              </div>
            </div>
          </v-card></v-form>

<!-- Debug stuff below -->
          <span v-if="devMode">
            <br>
            <textarea rows="30" cols="50" style="font-size: 10px;">{{ JSON.stringify(charData, null, 2) }}</textarea>
          </span>
        </v-container>
      </v-main>
    </v-app>
  </div>

  <script type="module" src="common.js"></script>
  <script type="module">

// Firebase config to enable remote viewing of the tracker data
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getDatabase, ref, update, remove, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { lootRate, elapsedTracker, sortedTracker, suggest, localLoad, enumerateVoices, configSpeech } from './common.js';
import { KokoroTTS } from "https://esm.sh/kokoro-js@1.2.1/dist/kokoro.web.js";

const firebaseConfig = {
    apiKey: "AIzaSyBJYHL7v9lBO5FDFGRTohp1yF94NVnYLOY",
    authDomain: "embertracker.firebaseapp.com",
    databaseURL: "https://embertracker-default-rtdb.firebaseio.com",
    projectId: "embertracker",
    storageBucket: "embertracker.firebasestorage.app",
    messagingSenderId: "930812014694",
    appId: "1:930812014694:web:fecf713742575e36cafda7"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
var unsubscribe = null;

// Vue config and app initialization
const { createApp } = Vue;
// Vuetify initialization
const { createVuetify } = Vuetify;
//const { aliases, mdi } = Vuetify;
const vuetify = createVuetify({ icons: { defaultSet: 'mdi' } });

const App = {
    data() {
        return {
            authed: false,
            charData: {},
            devMode: 0,
            ttsEngine: null,
            selectedVoice: 'bf_emma',
            volume: 0.4,
            isLoading: false,
            activeAudio: null,
            applyingRemote: false,
            savingCharData: false,
            saveEchoTimer: null,
            remoteCharDataSnapshot: null,
            saveTimer: null,
            voiceGroups: {
                "British (Authoritative & Crisp)": [
                    { id: "bf_emma", name: "Emma (Female - Formal & Authoritative)" },
                    { id: "bf_isabella", name: "Isabella (Female - Clear & Direct)" },
                    { id: "bf_alice", name: "Alice (Female)" },
                    { id: "bf_lily", name: "Lily (Female)" },
                    { id: "bm_george", name: "George (Male - Executive)" },
                    { id: "bm_lewis", name: "Lewis (Male)" },
                    { id: "bm_daniel", name: "Daniel (Male)" },
                    { id: "bm_fable", name: "Fable (Male)" }
                ],
                "American (Standard Neural)": [
                    { id: "af_heart", name: "Heart (Female - Default)" },
                    { id: "af_bella", name: "Bella (Female - Clear)" },
                    { id: "af_nicole", name: "Nicole (Female - Sharp)" },
                    { id: "af_sarah", name: "Sarah (Female)" },
                    { id: "af_sky", name: "Sky (Female)" },
                    { id: "am_adam", name: "Adam (Male)" },
                    { id: "am_michael", name: "Michael (Male)" }
                ]
            },
            charClasses: [
                { id: 'berserker',  text: 'Berserker'  },
                { id: 'brigand',    text: 'Brigand'    },
                { id: 'duelist',    text: 'Duelist'    },
                { id: 'knight',     text: 'Knight'     },
                { id: 'juggernaut', text: 'Juggernaut' },
                { id: 'marshal',    text: 'Marshal'    },
                { id: 'sentinel',   text: 'Sentinel'   },
                { id: 'warden',     text: 'Warden'     },
                { id: 'warlord',    text: 'Warlord'    },
            ],
            charIcons: {
                'berserker':  {'icon': 'mdi-axe-battle', 'color': 'red'},
                'brigand':    {'icon': 'mdi-sword-cross', 'color': 'red'},
                'duelist':    {'icon': 'mdi-sword', 'color': 'green'},
                'knight':     {'icon': 'mdi-shield-sword', 'color': 'blue'},
                'juggernaut': {'icon': 'mdi-gavel', 'color': 'blue'},
                'marshal':    {'icon': 'mdi-security', 'color': 'blue'},
                'sentinel':   {'icon': 'mdi-chess-rook', 'color': 'green'},
                'warden':     {'icon': 'mdi-ladybug', 'color': 'red'},
                'warlord':    {'icon': 'mdi-music', 'color': 'green'},
                "Unknown":    {'icon': 'mdi-help-box', 'color': 'black'}
            },
        }
    },
    methods: {
        // Converts a string to Title Case for display purposes
        toTitleCase(str) {
            if (!str) return "";
            return str.toLowerCase().replace(/(^|\s)\w/g, (match) => match.toUpperCase());
        },
        // Converts a string to a lowercase, no-space version for consistent ID usage
        toIdCase(str) {
            if (!str) return "";
            return str.toLowerCase().replace(/\s+/g, '');
        },
        localLoad,
        async speakPhoneticName(playerId) {
            const player = this.charData[playerId];
            if (!player) return;
            const text = (player.phonetic || player.name || '').trim();
            if (!text) return;

            // Initialize engine if needed
            if (!this.ttsEngine) {
                try {
                    this.isLoading = true;
                    this.ttsEngine = await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', {
                        dtype: 'fp32',
                        device: 'webgpu'
                    });
                } catch (err) {
                    console.error('Failed to initialize Kokoro TTS:', err);
                    this.isLoading = false;
                    return;
                }
            }

            try {
                this.isLoading = true;
                const audioOutput = await this.ttsEngine.generate(text, {
                    voice: this.selectedVoice
                });
                const audioBlob = audioOutput.toBlob();
                const audioUrl = URL.createObjectURL(audioBlob);

                if (this.activeAudio) this.activeAudio.pause();

                this.activeAudio = new Audio(audioUrl);
                this.activeAudio.volume = this.volume;
                this.activeAudio.onended = () => URL.revokeObjectURL(audioUrl);
                await this.activeAudio.play();
            } catch (err) {
                console.error('Kokoro TTS generation failed:', err);
            } finally {
                this.isLoading = false;
            }
        },
        addChar(name, charClass='Unknown', level=50) {
            if (!this.authed) {
                alert('You are not logged in.');
                return;
            }
            // Add a new character to the charData based on the input field value
            const input = document.getElementById('new_char_name');
            if (!name) {
                name = input.value.trim();
                input.value = '';
                input.focus();
            }
            let id = this.toIdCase(name);
            if (name && !(id in this.charData)) {
                // Add the new character with default values
                this.charData[id] = {
                    charClass: charClass,
                    level: level,
                    name: this.toTitleCase(name),
                    phonetic: '',
                };
                input.value = '';
            }
        },
        delChar(id) {
            if (confirm(`Are you sure you want to delete character: ${this.charData[id].name}?\nThis action cannot be undone.`)) {
                if (id in this.charData) {
                    delete this.charData[id];
                } else {
                    console.warn(`Attempted to delete non-existent character with id: ${id}`);
                }
            }
        },
        delChars() {
            if (confirm(`Are you sure you want to delete ALL characters?\nThis action cannot be undone.`)) {
                if (confirm('Just to be clear, ARE YOU SURE?\nYou want to enter all those names again manually?')) {
                    this.charData = {};
                }
            }
        },
        dev() {
            // Add a few test characters from Scooby-Doo and trackers for demonstration purposes
            this.addChar("Shaggy");
            this.addChar("Velma");
            this.addChar("Fred");
            this.addChar("Daphne");
            this.addChar("Scooby");
            this.addChar("Old Man Withers");
        },
        devSkralg() {
            // Add a few test characters from Scooby-Doo and trackers for demonstration purposes
            this.addChar("Skralg", "warden");
        },
        cloneCharData(data) {
            return data ? JSON.parse(JSON.stringify(data)) : {};
        },
        fieldValuesEqual(a, b) {
            if (a === b) return true;
            if (a == null && b == null) return true;
            if (typeof a === 'object' || typeof b === 'object') {
                return JSON.stringify(a) === JSON.stringify(b);
            }
            return false;
        },
        migrateCharDataShape(data) {
            if (!data || typeof data !== 'object') return data;
            for (const id of Object.keys(data)) {
                const entry = data[id];
                if (!entry || typeof entry !== 'object') continue;
                entry.phonetic = entry.phonetic == null ? '' : String(entry.phonetic);
                delete entry.js_phonetic;
                delete entry.edge_phonetic;
            }
            return data;
        },
        diffCharData(local, base) {
            const updates = {};
            const removeIds = [];
            const localData = local || {};
            const baseData = base || {};

            for (const id of Object.keys(baseData)) {
                if (!(id in localData)) removeIds.push(id);
            }

            for (const id of Object.keys(localData)) {
                const loc = localData[id];
                const bas = baseData[id];
                if (!bas) {
                    updates[`charData/${id}`] = loc;
                    continue;
                }
                const fields = new Set([...Object.keys(loc), ...Object.keys(bas)]);
                for (const field of fields) {
                    const lv = loc[field];
                    const bv = bas[field];
                    if (this.fieldValuesEqual(lv, bv)) continue;
                    if (!(field in loc)) {
                        updates[`charData/${id}/${field}`] = null;
                    } else {
                        updates[`charData/${id}/${field}`] = lv;
                    }
                }
            }
            return { updates, removeIds };
        },
        receiveRemoteCharData(raw) {
            const data = raw
                ? this.migrateCharDataShape(this.cloneCharData(raw))
                : {};
            if (this.savingCharData) {
                this.savingCharData = false;
                if (this.saveEchoTimer) {
                    clearTimeout(this.saveEchoTimer);
                    this.saveEchoTimer = null;
                }
                this.remoteCharDataSnapshot = this.cloneCharData(data);
                return;
            }
            this.applyingRemote = true;
            this.charData = data;
            this.remoteCharDataSnapshot = this.cloneCharData(data);
            this.$nextTick(() => { this.applyingRemote = false; });
        },
        loadChars() {
            const tPath = 'charData';
            if (unsubscribe) unsubscribe();
            const dataRef = ref(db, tPath);
            unsubscribe = onValue(dataRef, (snapshot) => {
                const raw = snapshot.exists() ? snapshot.val() : {};
                this.receiveRemoteCharData(raw);
            }, (error) => {
                console.error("Error loading character data: ", error);
            });
        },
        scheduleCharDataSave() {
            if (!this.authed || this.applyingRemote) return;
            if (this.saveTimer) clearTimeout(this.saveTimer);
            this.saveTimer = setTimeout(() => {
                this.saveTimer = null;
                this.flushCharDataUpdates();
            }, 300);
        },
        async flushCharDataUpdates() {
            if (!this.authed || this.applyingRemote) return;
            const local = this.charData || {};
            const base = this.remoteCharDataSnapshot || {};
            const { updates, removeIds } = this.diffCharData(local, base);
            if (!Object.keys(updates).length && !removeIds.length) return;

            try {
                this.savingCharData = true;
                if (this.saveEchoTimer) clearTimeout(this.saveEchoTimer);
                this.saveEchoTimer = setTimeout(() => {
                    this.savingCharData = false;
                    this.saveEchoTimer = null;
                }, 5000);
                const ops = [];
                if (Object.keys(updates).length) ops.push(update(ref(db), updates));
                for (const id of removeIds) ops.push(remove(ref(db, `charData/${id}`)));
                await Promise.all(ops);
                this.remoteCharDataSnapshot = this.cloneCharData(local);
            } catch (error) {
                this.savingCharData = false;
                if (this.saveEchoTimer) {
                    clearTimeout(this.saveEchoTimer);
                    this.saveEchoTimer = null;
                }
                console.error("Error saving character data: ", error);
            }
        },
        auth() {
            if (!this.authed) {
                let pass = prompt("Please enter a valid password to authenticate.");
                if (!pass) return;
                const auth = getAuth();
                signInWithEmailAndPassword(auth, 'anon@ymo.us', pass).then((userCredential) => {
                    console.log('Anonymous login approved');
                    this.authed = true;
                    // Load characters from the database
                    this.loadChars();
                }).catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.error("Sign-in error: ", errorMessage);
                });
            }
        }
    },
    computed: {
        sortedPlayerIds() {
            return Object.keys(this.charData).sort((a, b) => {
                const A = this.charData[a];
                const B = this.charData[b];
                // Sort by checked status first, then alphabetically by name
                if (A.checked && !B.checked) return -1;
                if (!A.checked && B.checked) return 1;
                return A.name.localeCompare(B.name);
            })
        },
        /** Wide enough for longest class label + prepend icon + outlined field chrome. */
        classSelectWidthStyle() {
            const longest = this.charClasses.reduce((best, c) => {
                const t = String(c.text ?? '');
                return t.length > best.length ? t : best;
            }, '');
            const n = Math.max(longest.length, 1);
            const rem = Math.min(22, Math.max(11.25, n * 0.72 + 5.35));
            return { width: `${rem}rem`, maxWidth: '100%' };
        },
    },
    watch: {
        charData: {
            handler() { this.scheduleCharDataSave(); },
            deep: true
        },
    },
    beforeUnmount() {
        if (unsubscribe) unsubscribe();
        if (this.saveTimer) clearTimeout(this.saveTimer);
        if (this.saveEchoTimer) clearTimeout(this.saveEchoTimer);
    },
    async mounted() {
        // Detect dev mode based on URL parameter and set flag accordingly
        const urlParams = new URLSearchParams(window.location.search);
        this.devMode = urlParams.get('dev') === '1';

        // Add event listener to the whole app to toggle dev mode with ctrl-alt-d
        window.addEventListener('keydown', (event) => {
            if (event.ctrlKey && event.altKey && event.key === 'd') {
                this.devMode = !this.devMode;
            }
        });

        // Add event listener to the input field to allow adding characters by pressing Enter
        const charInput = document.getElementById('new_char_name');
        if (charInput) {
            charInput.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') this.addChar();
            });
        }
        // Focus the input field on page load for convenience
        charInput.focus();

        // Pre-warm Kokoro TTS engine
        try {
            this.ttsEngine = await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', {
                dtype: 'fp32',
                device: 'webgpu'
            });
        } catch (err) {
            console.warn('Kokoro TTS engine pre-warming failed (will retry on first use):', err);
        }

        this.localLoad();
        this.loadChars();
    },
};
createApp(App).use(vuetify).mount('#app')
  </script>
</body>
</html>
